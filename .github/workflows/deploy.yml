name: Deploy Mindfuels to Hostinger

on:
  push:
    branches:
      - main  # Auto-deploys every time you push to main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Deploy Frontend (React)
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for production
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: mindfuels-api-v2
          VITE_SHOW_TEACHERS_RECOMMENDATION: "true"
          VITE_SHOW_PARENTS_FIRST_CHOICE: "true"

      - name: Copy .htaccess into dist
        run: cp frontend/dist/.htaccess frontend/dist/.htaccess 2>/dev/null || echo "No .htaccess to copy"

      - name: Deploy frontend to Hostinger (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: public_html/
          dangerous-clean-slate: false

  # ─────────────────────────────────────────
  # JOB 2: Deploy Backend (Node.js)
  # ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: deploy-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/testEmail.js
            **/testShiprocket.js
            **/testServiceability.js
            **/scratch/**
          dangerous-clean-slate: false
